<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 03 · Today's knot plus a copy turned 90°, so four lobes fill the square. More layers. -->
  <defs>
    <linearGradient id="ka" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#b3196a"/>
    </linearGradient>
    <linearGradient id="kb" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b3196a"/><stop offset="100%" stop-color="#d4900a"/>
    </linearGradient>
    <g id="knot">
      <path d="M 12 32 C 12 18 24 14 32 22 C 40 30 52 30 52 18"/>
      <path d="M 52 18 C 52 30 40 30 32 38 C 24 46 12 46 12 32"/>
      <path d="M 12 18 C 12 30 24 30 32 22"/>
      <path d="M 32 38 C 40 46 52 46 52 32 C 52 18 40 14 32 22"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f6f1e6"/>
  <g stroke-width="3.6">
    <use href="#knot" transform="translate(0 2) rotate(90 32 30)" stroke="url(#kb)" opacity="0.85"/>
    <use href="#knot" transform="translate(0 2)" stroke="url(#ka)"/>
  </g>
</svg>
