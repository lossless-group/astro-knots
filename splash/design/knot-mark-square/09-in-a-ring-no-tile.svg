<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 09 · 07 without the tile: a transparent favicon that sits on the browser's own tab color.
       Recolors for dark tabs through prefers-color-scheme (supported in SVG favicons by most browsers). -->
  <style>
    .a0 { stop-color: #1e1b4b } .a1 { stop-color: #b3196a } .b1 { stop-color: #d4900a }
    @media (prefers-color-scheme: dark) {
      .a0 { stop-color: #7b8bff } .a1 { stop-color: #c8ff2e } .b1 { stop-color: #ffb84d }
    }
  </style>
  <defs>
    <linearGradient id="ka" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="a0"/><stop offset="100%" class="a1"/>
    </linearGradient>
    <linearGradient id="kb" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="a1"/><stop offset="100%" class="b1"/>
    </linearGradient>
    <linearGradient id="kr" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" class="b1"/><stop offset="50%" class="a1"/><stop offset="100%" class="a0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28.5" stroke="url(#kr)" stroke-width="5"/>
  <g transform="translate(32 32) scale(0.92) translate(-32 -30)" stroke-width="6">
    <path d="M 12 32 C 12 18 24 14 32 22 C 40 30 52 30 52 18" stroke="url(#ka)"/>
    <path d="M 52 18 C 52 30 40 30 32 38 C 24 46 12 46 12 32" stroke="url(#ka)"/>
    <path d="M 12 18 C 12 30 24 30 32 22" stroke="url(#kb)"/>
    <path d="M 32 38 C 40 46 52 46 52 32 C 52 18 40 14 32 22" stroke="url(#kb)"/>
  </g>
</svg>
