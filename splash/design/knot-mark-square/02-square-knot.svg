<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 02 · Two rounded squares, linked: over at one crossing, under at the other. Square by nature. -->
  <defs>
    <linearGradient id="ka" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#b3196a"/>
    </linearGradient>
    <linearGradient id="kb" x1="64" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b3196a"/><stop offset="100%" stop-color="#d4900a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f6f1e6"/>
  <g stroke-width="5.4">
    <rect x="8" y="10" width="30" height="30" rx="8" stroke="url(#ka)"/>
    <rect x="26" y="24" width="30" height="30" rx="8" stroke="url(#kb)"/>
    <!-- A passes over B where A's right side meets B's top: knock out, then redraw A -->
    <path d="M 38 18.5 V 29.5" stroke="#f6f1e6" stroke-width="9.4" stroke-linecap="butt"/>
    <path d="M 38 18 V 30" stroke="url(#ka)" stroke-linecap="butt"/>
  </g>
</svg>
